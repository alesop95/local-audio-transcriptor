[project]
name = "local-audio-transcriptor"
version = "0.1.0"
description = "Tool locale e cross-platform (Windows/Linux) per trascrivere audio da file o YouTube, con diarizzazione opzionale."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "yt-dlp>=2025.1.1",
    "imageio-ffmpeg>=0.5.1",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
# Stack di trascrizione/diarizzazione (pesante: torch, ctranslate2, pyannote).
# Installa con:  uv pip install -e ".[asr]"
asr = [
    "whisperx>=3.1.1",
]
# Interfaccia grafica locale (Fase 5)
gui = [
    "gradio>=4.0",
]
# Traduzione offline (NMT locale)
translate = [
    "argostranslate>=1.9",
]

[project.scripts]
transcribe = "transcriptor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriptor"]
